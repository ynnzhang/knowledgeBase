name: Node 24 compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:local
      - run: npm run test:feishu
      - run: npm run test:outline
      - run: npx tsc --noEmit
      # Rust release builds and API checks run in verify.yml on all three OSes.
